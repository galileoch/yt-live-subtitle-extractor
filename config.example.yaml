# Copy to config.yaml, then fill in api_key locally. NEVER commit config.yaml.
api_key: "YOUR_API_KEY_HERE"
api_base_url: "https://generativelanguage.googleapis.com" # HTTP proxy URL is also accepted
# e.g. api_base_url: "http://192.168.1.20:8080"
default_language: "ja-JP" # Empty string = auto-detect
model: "gemini-3.5-transcribe"
# file: Files API upload/URI; inline: direct Base64 in Interactions API
audio_input: "file"
output: "transcript.srt"
diarize: false
chunk_minutes: 10
overlap: 2
max_chars: 64
max_words: 14
max_seconds: 5.5
gap: 0.75
retries: 3
keep_work: false
